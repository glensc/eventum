name: "Tests"

on:
  push:
    paths-ignore:
      - "docs/**"
    branches:
      - master
      - docker-publish-v2
    tags:
      - snapshot
      - v*
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build release
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout eventum/eventum code
        uses: actions/checkout@v2

      - name: Set version variable
        id: vars
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          if [[ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]]; then
            APP_VERSION=${GITHUB_REF#refs/tags/}
          else
            git fetch origin --tags --unshallow "+refs/tags/v*:refs/tags/v*"
            version=$(git describe --tags --match=v*)
            APP_VERSION=${version#v}
          fi
          echo ::set-output name=version::$APP_VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Download a release
        run: |
          wget https://github.com/eventum/eventum/releases/download/snapshot/eventum-3.10.9-51-gd44b4ec8e.tar.xz

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}

      - name: Checkout eventum/docker code
        uses: actions/checkout@v2
        with:
         repository: eventum/docker
         path: docker

      - name: Prepare tarball for Docker build
        run: |
          ln eventum-*.tar.xz docker

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export to Docker
        uses: docker/build-push-action@v2
        with:
          context: docker
          load: true
          build-args: |
            BUILDTYPE=local
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: |
            type=docker,dest=eventum-docker-${{ steps.vars.outputs.version }}.tar

      - name: Export docker image
        run: |
          set -x
          ls -l eventum-docker*
          file eventum-docker*
          IMAGE=$REGISTRY/${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          docker history --human=false $IMAGE

      - uses: actions/upload-artifact@v2
        with:
          name: docker-${{ steps.vars.outputs.version }}
          path: eventum-docker-*.tar
          if-no-files-found: error

